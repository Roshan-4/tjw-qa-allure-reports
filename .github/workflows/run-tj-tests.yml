name: Run TJ Lead Forms Suite

# This repo (Roshan-4/tjw-qa-allure-reports) is public, so GitHub Actions minutes here are
# unlimited/free — unlike the private auto-junction/tjw-qa-automation repo where the actual
# test code lives. This workflow checks out that private repo's code (via PRIVATE_REPO_TOKEN,
# a repo secret with read access to it), runs the Cypress suites here instead, publishes the
# combined Allure report to this repo's own gh-pages content, and emails the result — so none
# of it counts against the private repo's Actions quota.
#
# IMPORTANT — Admin panel is NEVER run here. Specs under cypress/e2e/Tests/Admin/ (or anything
# that logs into manage.tractorjunction.com / tractorjunction.com/manage) mutate real, currently
# -live production content and must only ever be run manually, under direct supervision — never
# unattended in CI. None of the suites below reference that folder; do not add one that does.
#
# All private-repo checkouts pin `ref: Locator-Fixing` — the code under test lives on that
# branch, not the default branch, as of Sep 2026. Update REF below if/when that changes.
#
# Trigger is schedule + workflow_dispatch ONLY (never pull_request) — schedule always runs the
# workflow as defined on the default branch (gh-pages, this repo's default), not from a PR, and
# workflow_dispatch requires someone with write access to trigger it manually. This avoids the
# "pwn request" class of vulnerability where an outside contributor's PR could rewrite the
# workflow to exfiltrate secrets.

on:
  schedule:
    # 21:30 UTC = 03:00 AM IST (next day).
    - cron: '30 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NODE_VERSION: 20
  PRIVATE_REPO: auto-junction/tjw-qa-automation
  REF: Locator-Fixing
  # cypress.config.js reads process.env[ENV] directly as baseUrl, normally sourced from the
  # private repo's own gitignored .env (which a fresh CI checkout doesn't have). This is
  # tractorjunction.com's public URL, not a secret.
  PROD_URL: https://www.tractorjunction.com/

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # AllLeadFormsSuit — run as an isolated per-spec list (not the aggregated suite
          # file) deliberately: that file require()s all 13 specs into one continuous browser
          # session, which degrades badly over ~100+ PROD page navigations (documented in
          # AGENTS.md). Comma-separated --spec gives each file its own fresh browser.
          - suite: allleadforms
            device: desktop
            specs: cypress/e2e/Tests/LeadForms/LeadDealers.cy.js,cypress/e2e/Tests/LeadForms/CustomerCareLeadForms.cy.js,cypress/e2e/Tests/LeadForms/LeadNewTractors.cy.js,cypress/e2e/Tests/LeadForms/LeadNewImplements.cy.js,cypress/e2e/Tests/LeadForms/LeadNewHarvesters.cy.js,cypress/e2e/Tests/LeadForms/LeadNewTractorRequestCallBack.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedTractors.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedImplements.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedHarvester.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedTractorRequestCallBack.cy.js,cypress/e2e/Tests/LeadForms/LeadSellUsed.cy.js,cypress/e2e/Tests/HomePage/HomePageLeadForms.cy.js,cypress/e2e/Tests/LeadForms/LeadTyres.cy.js
          - suite: allleadforms
            device: mobile
            specs: cypress/e2e/Tests/LeadForms/LeadDealers.cy.js,cypress/e2e/Tests/LeadForms/CustomerCareLeadForms.cy.js,cypress/e2e/Tests/LeadForms/LeadNewTractors.cy.js,cypress/e2e/Tests/LeadForms/LeadNewImplements.cy.js,cypress/e2e/Tests/LeadForms/LeadNewHarvesters.cy.js,cypress/e2e/Tests/LeadForms/LeadNewTractorRequestCallBack.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedTractors.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedImplements.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedHarvester.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedTractorRequestCallBack.cy.js,cypress/e2e/Tests/LeadForms/LeadSellUsed.cy.js,cypress/e2e/Tests/HomePage/HomePageLeadForms.cy.js,cypress/e2e/Tests/LeadForms/LeadTyres.cy.js

          # HomePageSuite — 19 specs
          - suite: homepage
            device: desktop
            specs: cypress/e2e/Tests/HomePage/FindYourRightTractor.cy.js,cypress/e2e/Tests/HomePage/TractorsInYear.cy.js,cypress/e2e/Tests/HomePage/TractorsByBrands.cy.js,cypress/e2e/Tests/HomePage/BuyUsedTractor.cy.js,cypress/e2e/Tests/HomePage/GetUsedTractorsInStates.cy.js,cypress/e2e/Tests/HomePage/TractorsByBudget.cy.js,cypress/e2e/Tests/HomePage/TractorsByHP.cy.js,cypress/e2e/Tests/HomePage/MiniTractors.cy.js,cypress/e2e/Tests/HomePage/CompareTractors.cy.js,cypress/e2e/Tests/HomePage/PopularTractorImplements.cy.js,cypress/e2e/Tests/HomePage/TractorNews.cy.js,cypress/e2e/Tests/HomePage/LatestBlogVideo.cy.js,cypress/e2e/Tests/HomePage/ToolsAndServices.cy.js,cypress/e2e/Tests/HomePage/SocialMediaSection.cy.js,cypress/e2e/Tests/HomePage/TopNewTractors.cy.js,cypress/e2e/Tests/HomePage/TractorJunctionServices.cy.js,cypress/e2e/Tests/HomePage/FarmjunctionPlatform.cy.js,cypress/e2e/Tests/HomePage/FooterLinks.cy.js,cypress/e2e/Tests/HomePage/FooterSocialBottom.cy.js
          - suite: homepage
            device: mobile
            specs: cypress/e2e/Tests/HomePage/FindYourRightTractor.cy.js,cypress/e2e/Tests/HomePage/TractorsInYear.cy.js,cypress/e2e/Tests/HomePage/TractorsByBrands.cy.js,cypress/e2e/Tests/HomePage/BuyUsedTractor.cy.js,cypress/e2e/Tests/HomePage/GetUsedTractorsInStates.cy.js,cypress/e2e/Tests/HomePage/TractorsByBudget.cy.js,cypress/e2e/Tests/HomePage/TractorsByHP.cy.js,cypress/e2e/Tests/HomePage/MiniTractors.cy.js,cypress/e2e/Tests/HomePage/CompareTractors.cy.js,cypress/e2e/Tests/HomePage/PopularTractorImplements.cy.js,cypress/e2e/Tests/HomePage/TractorNews.cy.js,cypress/e2e/Tests/HomePage/LatestBlogVideo.cy.js,cypress/e2e/Tests/HomePage/ToolsAndServices.cy.js,cypress/e2e/Tests/HomePage/SocialMediaSection.cy.js,cypress/e2e/Tests/HomePage/TopNewTractors.cy.js,cypress/e2e/Tests/HomePage/TractorJunctionServices.cy.js,cypress/e2e/Tests/HomePage/FarmjunctionPlatform.cy.js,cypress/e2e/Tests/HomePage/FooterLinks.cy.js,cypress/e2e/Tests/HomePage/FooterSocialBottom.cy.js

          # PageRedirectionsSuit — 25 specs
          - suite: pageredirections
            device: desktop
            specs: cypress/e2e/Tests/PageRedirections/Top500PageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/HeaderRedirections.cy.js,cypress/e2e/Tests/PageRedirections/FooterRedirections.cy.js,cypress/e2e/Tests/PageRedirections/HomePageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewTractorsListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedTractorsListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewImplementsListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedImplementsListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewHarvestersListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedHarvestersListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewTractorsProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedTractorsProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewImplementsProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedImplementsProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewHarvestersProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedHarvestersProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/BrandListingpages.cy.js,cypress/e2e/Tests/PageRedirections/AllBrandsPage.cy.js,cypress/e2e/Tests/PageRedirections/ComparePages.cy.js,cypress/e2e/Tests/PageRedirections/EMICalculatorPages.cy.js,cypress/e2e/Tests/PageRedirections/LoanPages.cy.js,cypress/e2e/Tests/PageRedirections/DealersPages.cy.js,cypress/e2e/Tests/PageRedirections/NewsPages.cy.js,cypress/e2e/Tests/PageRedirections/ShowroomPages.cy.js,cypress/e2e/Tests/PageRedirections/TyrePages.cy.js
          - suite: pageredirections
            device: mobile
            specs: cypress/e2e/Tests/PageRedirections/Top500PageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/HeaderRedirections.cy.js,cypress/e2e/Tests/PageRedirections/FooterRedirections.cy.js,cypress/e2e/Tests/PageRedirections/HomePageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewTractorsListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedTractorsListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewImplementsListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedImplementsListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewHarvestersListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedHarvestersListingPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewTractorsProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedTractorsProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewImplementsProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedImplementsProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/NewHarvestersProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/UsedHarvestersProductDetailPageRedirections.cy.js,cypress/e2e/Tests/PageRedirections/BrandListingpages.cy.js,cypress/e2e/Tests/PageRedirections/AllBrandsPage.cy.js,cypress/e2e/Tests/PageRedirections/ComparePages.cy.js,cypress/e2e/Tests/PageRedirections/EMICalculatorPages.cy.js,cypress/e2e/Tests/PageRedirections/LoanPages.cy.js,cypress/e2e/Tests/PageRedirections/DealersPages.cy.js,cypress/e2e/Tests/PageRedirections/NewsPages.cy.js,cypress/e2e/Tests/PageRedirections/ShowroomPages.cy.js,cypress/e2e/Tests/PageRedirections/TyrePages.cy.js

          # UsedTractorSuite — 2 specs
          - suite: usedtractor
            device: desktop
            specs: cypress/e2e/Tests/ListingPages/UsedTractorListingRevamp.cy.js,cypress/e2e/Tests/ProductDetailPages/UsedTractorsProductDetailPages.cy.js
          - suite: usedtractor
            device: mobile
            specs: cypress/e2e/Tests/ListingPages/UsedTractorListingRevamp.cy.js,cypress/e2e/Tests/ProductDetailPages/UsedTractorsProductDetailPages.cy.js

          # LocationMasterSuit — 7 specs (suite file's paths fixed Sep 2026, see AGENTS.md)
          - suite: locationmaster
            device: desktop
            specs: cypress/e2e/Tests/LocationMaster/StateValidations/StateValidations.cy.js,cypress/e2e/Tests/LocationMaster/DistrictValidations/DistrictValidations.cy.js,cypress/e2e/Tests/LocationMaster/TehsilValidations/TehsilValidations.cy.js,cypress/e2e/Tests/LocationMaster/LMPageRedirections/Top500PageRedirections.cy.js,cypress/e2e/Tests/LocationMaster/LMPageRedirections/UsedTractorsByStateRedirections.cy.js,cypress/e2e/Tests/LocationMaster/LMPageRedirections/UsedTractorsByCityRedirections.cy.js,cypress/e2e/Tests/LocationMaster/LMPageRedirections/DealersByStateCityRedirections.cy.js
          - suite: locationmaster
            device: mobile
            specs: cypress/e2e/Tests/LocationMaster/StateValidations/StateValidations.cy.js,cypress/e2e/Tests/LocationMaster/DistrictValidations/DistrictValidations.cy.js,cypress/e2e/Tests/LocationMaster/TehsilValidations/TehsilValidations.cy.js,cypress/e2e/Tests/LocationMaster/LMPageRedirections/Top500PageRedirections.cy.js,cypress/e2e/Tests/LocationMaster/LMPageRedirections/UsedTractorsByStateRedirections.cy.js,cypress/e2e/Tests/LocationMaster/LMPageRedirections/UsedTractorsByCityRedirections.cy.js,cypress/e2e/Tests/LocationMaster/LMPageRedirections/DealersByStateCityRedirections.cy.js

    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      total: ${{ steps.stats.outputs.total }}
      passing: ${{ steps.stats.outputs.passing }}
      failing: ${{ steps.stats.outputs.failing }}
    steps:
      - name: Checkout private test-automation repo (${{ env.REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules + Cypress binary
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (only on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify Cypress binary is present
        run: npx cypress verify

      - name: Run ${{ matrix.suite }} — ${{ matrix.device }} (PROD, English)
        env:
          ENV: PROD
          PROD: ${{ env.PROD_URL }}
          DEVICE: ${{ matrix.device == 'mobile' && 'vivo-t4x' || '' }}
        run: >
          npx cypress run --browser chrome --config video=false --env allure=true
          --spec "${{ matrix.specs }}" | tee cypress-run.log
        continue-on-error: true

      - name: Aggregate pass/fail counts
        id: stats
        run: |
          total=$(grep -oE '│\s*Tests:\s*[0-9]+' cypress-run.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          passing=$(grep -oE '│\s*Passing:\s*[0-9]+' cypress-run.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          failing=$(grep -oE '│\s*Failing:\s*[0-9]+' cypress-run.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passing=$passing" >> "$GITHUB_OUTPUT"
          echo "failing=$failing" >> "$GITHUB_OUTPUT"

      - name: Upload allure-results (${{ matrix.suite }}-${{ matrix.device }})
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}-${{ matrix.device }}
          path: allure-results
          retention-days: 7
          if-no-files-found: warn

  publish-report:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private test-automation repo (${{ env.REF }}) (for allure-config + branding script)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: tjw-qa-automation

      - name: Checkout report repo (this repo, gh-pages)
        uses: actions/checkout@v4
        with:
          path: report-repo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: tjw-qa-automation/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('tjw-qa-automation/package-lock.json') }}

      - name: Install dependencies (only on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: tjw-qa-automation
        run: npm ci

      - name: Download all allure-results artifacts
        uses: actions/download-artifact@v4
        with:
          path: tjw-qa-automation/allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Generate Allure report
        working-directory: tjw-qa-automation
        run: npm run generate:report

      - name: Count total/passed/failed from Allure's own generated summary
        id: counts
        working-directory: tjw-qa-automation/allure-report/widgets
        run: |
          # FIX (Sep 2026): counting raw allure-results/*-result.json files directly previously
          # reported ~2x the real number (e.g. 780 instead of the true 390) — some tests write
          # more than one *-result.json (retries/hook-wrapped results) that Allure's own report
          # generator correctly collapses into one test in its statistics, but a naive file count
          # does not. Read the numbers Allure itself computed (widgets/summary.json, produced by
          # the "Generate Allure report" step above) instead — this is exactly what the published
          # report shows, so the email can never disagree with it again.
          node -e "
            const s = require('./summary.json').statistic;
            console.log('total=' + s.total);
            console.log('passing=' + s.passed);
            console.log('failing=' + (s.failed + s.broken));
          " >> "$GITHUB_OUTPUT"

      - name: Publish report into this repo's gh-pages content
        id: publish
        run: |
          set -e
          cd report-repo
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -not -name '.github' -exec rm -rf {} +
          cp -r ../tjw-qa-automation/allure-report/. .
          touch .nojekyll
          git config user.name "tjw-qa-automation-bot"
          git config user.email "noreply@tractorjunction.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No report changes to publish"
          else
            git commit -m "Publish report $(date -u '+%Y-%m-%d %H:%M:%S UTC') [nightly CI]"
            git push origin gh-pages
          fi
          echo "report_url=https://roshan-4.github.io/tjw-qa-allure-reports/" >> "$GITHUB_OUTPUT"

      - name: Send report email (roshanpaswan@tractorjunction.com, mujjamilsalim@tractorjunction.com)
        env:
          EMAIL_API_URL: ${{ secrets.EMAIL_API_URL }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_SOURCE: ${{ secrets.EMAIL_SOURCE }}
          EMAIL_IDENTIFIER: ${{ secrets.EMAIL_IDENTIFIER }}
          EMAIL_PROJECT_NAME: ${{ secrets.EMAIL_PROJECT_NAME }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          REPORT_URL: ${{ steps.publish.outputs.report_url }}
          TOTAL_TESTS: ${{ steps.counts.outputs.total }}
          PASSING: ${{ steps.counts.outputs.passing }}
          FAILED_COUNT: ${{ steps.counts.outputs.failing }}
          BRANCH_REF: ${{ env.REF }}
        run: |
          set -e
          PRIORITY="Normal"
          if [ "${FAILED_COUNT:-0}" -gt 0 ]; then PRIORITY="High"; fi
          # IST via fixed +330 min offset rather than a named timezone — works the same
          # regardless of the runner's tzdata availability.
          IST_NOW=$(date -u -d '+330 minutes' '+%Y-%m-%d %H:%M:%S IST')
          SUBJECT="Automation Execution Report - TractorJunction - $(date -u -d '+330 minutes' '+%Y-%m-%d')"
          EXECUTION_DATETIME="$IST_NOW"
          DESCRIPTION="This is the nightly full regression run for TractorJunction on PROD, tested in English across desktop and mobile viewports, on branch ${BRANCH_REF}. It covers the AllLeadFormsSuit, HomePageSuite, PageRedirectionsSuit, UsedTractorSuite, and LocationMasterSuit test suites. ${PASSING:-0} of ${TOTAL_TESTS:-0} test cases passed — see the attached Allure report for the full per-suite and per-device breakdown."

          curl -sS --location "$EMAIL_API_URL" \
            --header "X-Api-Key: ${EMAIL_API_KEY}" \
            --header 'Accept: application/json' \
            --form "email[]=roshanpaswan@tractorjunction.com" \
            --form "email[]=mujjamilsalim@tractorjunction.com" \
            --form "source=${EMAIL_SOURCE}" \
            --form "identifier=${EMAIL_IDENTIFIER}" \
            --form "data[projectName]=${EMAIL_PROJECT_NAME}" \
            --form "data[executionDateTime]=${EXECUTION_DATETIME}" \
            --form "data[environment]=PROD" \
            --form "data[reportUrl]=${REPORT_URL}" \
            --form "data[screenshotUrl]=" \
            --form "data[failedCount]=${FAILED_COUNT:-0}" \
            --form "data[totalTestCases]=${TOTAL_TESTS:-0}" \
            --form "data[description]=${DESCRIPTION}" \
            --form "data[priority]=${PRIORITY}" \
            --form "data[senderName]=${EMAIL_SENDER_NAME}" \
            --form "subject=${SUBJECT}"
