name: Run TJ Lead Forms Suite

# This repo (Roshan-4/tjw-qa-allure-reports) is public, so GitHub Actions minutes here are
# unlimited/free — unlike the private auto-junction/tjw-qa-automation repo where the actual
# test code lives. This workflow checks out that private repo's code (via PRIVATE_REPO_TOKEN,
# a repo secret with read access to it), runs the Cypress suite here instead, publishes the
# Allure report to this repo's own gh-pages content, and emails the result — so none of it
# counts against the private repo's Actions quota.
#
# Trigger is schedule + workflow_dispatch ONLY (never pull_request) — schedule always runs the
# workflow as defined on the default branch (gh-pages, this repo's default), not from a PR, and
# workflow_dispatch requires someone with write access to trigger it manually. This avoids the
# "pwn request" class of vulnerability where an outside contributor's PR could rewrite the
# workflow to exfiltrate secrets.

on:
  schedule:
    # 19:30 UTC = 01:00 AM IST. Adjust to taste.
    - cron: '30 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NODE_VERSION: 20

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      total: ${{ steps.stats.outputs.total }}
      passing: ${{ steps.stats.outputs.passing }}
      failing: ${{ steps.stats.outputs.failing }}
    steps:
      - name: Checkout private test-automation repo
        uses: actions/checkout@v4
        with:
          repository: auto-junction/tjw-qa-automation
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules + Cypress binary
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (only on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify Cypress binary is present
        run: npx cypress verify

      - name: Run AllLeadFormsSuit — desktop (PROD, English)
        env:
          ENV: PROD
          # cypress.config.js reads process.env[ENV] directly as the baseUrl (normally sourced
          # from the private repo's own gitignored .env, which a fresh CI checkout doesn't
          # have). PROD is tractorjunction.com's public URL, not a secret.
          PROD: https://www.tractorjunction.com/
        run: >
          npx cypress run --browser chrome --config video=false --env allure=true --spec
          "cypress/e2e/Tests/LeadForms/LeadDealers.cy.js,cypress/e2e/Tests/LeadForms/CustomerCareLeadForms.cy.js,cypress/e2e/Tests/LeadForms/LeadNewTractors.cy.js,cypress/e2e/Tests/LeadForms/LeadNewImplements.cy.js,cypress/e2e/Tests/LeadForms/LeadNewHarvesters.cy.js,cypress/e2e/Tests/LeadForms/LeadNewTractorRequestCallBack.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedTractors.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedImplements.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedHarvester.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedTractorRequestCallBack.cy.js,cypress/e2e/Tests/LeadForms/LeadSellUsed.cy.js,cypress/e2e/Tests/HomePage/HomePageLeadForms.cy.js,cypress/e2e/Tests/LeadForms/LeadTyres.cy.js"
          | tee cypress-desktop.log
        continue-on-error: true

      - name: Aggregate pass/fail counts
        id: stats
        run: |
          total=$(grep -oE '│\s*Tests:\s*[0-9]+' cypress-desktop.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          passing=$(grep -oE '│\s*Passing:\s*[0-9]+' cypress-desktop.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          failing=$(grep -oE '│\s*Failing:\s*[0-9]+' cypress-desktop.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passing=$passing" >> "$GITHUB_OUTPUT"
          echo "failing=$failing" >> "$GITHUB_OUTPUT"

      - name: Upload desktop allure-results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-desktop
          path: allure-results
          retention-days: 7

  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      total: ${{ steps.stats.outputs.total }}
      passing: ${{ steps.stats.outputs.passing }}
      failing: ${{ steps.stats.outputs.failing }}
    steps:
      - name: Checkout private test-automation repo
        uses: actions/checkout@v4
        with:
          repository: auto-junction/tjw-qa-automation
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules + Cypress binary
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (only on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify Cypress binary is present
        run: npx cypress verify

      - name: Run AllLeadFormsSuit — mobile vivo-t4x (PROD, English)
        env:
          ENV: PROD
          DEVICE: vivo-t4x
          PROD: https://www.tractorjunction.com/
        run: >
          npx cypress run --browser chrome --config video=false --env allure=true --spec
          "cypress/e2e/Tests/LeadForms/LeadDealers.cy.js,cypress/e2e/Tests/LeadForms/CustomerCareLeadForms.cy.js,cypress/e2e/Tests/LeadForms/LeadNewTractors.cy.js,cypress/e2e/Tests/LeadForms/LeadNewImplements.cy.js,cypress/e2e/Tests/LeadForms/LeadNewHarvesters.cy.js,cypress/e2e/Tests/LeadForms/LeadNewTractorRequestCallBack.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedTractors.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedImplements.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedHarvester.cy.js,cypress/e2e/Tests/LeadForms/LeadUsedTractorRequestCallBack.cy.js,cypress/e2e/Tests/LeadForms/LeadSellUsed.cy.js,cypress/e2e/Tests/HomePage/HomePageLeadForms.cy.js,cypress/e2e/Tests/LeadForms/LeadTyres.cy.js"
          | tee cypress-mobile.log
        continue-on-error: true

      - name: Aggregate pass/fail counts
        id: stats
        run: |
          total=$(grep -oE '│\s*Tests:\s*[0-9]+' cypress-mobile.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          passing=$(grep -oE '│\s*Passing:\s*[0-9]+' cypress-mobile.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          failing=$(grep -oE '│\s*Failing:\s*[0-9]+' cypress-mobile.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passing=$passing" >> "$GITHUB_OUTPUT"
          echo "failing=$failing" >> "$GITHUB_OUTPUT"

      - name: Upload mobile allure-results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile
          path: allure-results
          retention-days: 7

  publish-report:
    needs: [desktop-tests, mobile-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private test-automation repo (for allure-config + branding script)
        uses: actions/checkout@v4
        with:
          repository: auto-junction/tjw-qa-automation
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: tjw-qa-automation

      - name: Checkout report repo (this repo, gh-pages)
        uses: actions/checkout@v4
        with:
          path: report-repo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: tjw-qa-automation/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('tjw-qa-automation/package-lock.json') }}

      - name: Install dependencies (only on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: tjw-qa-automation
        run: npm ci

      - name: Download desktop allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-desktop
          path: tjw-qa-automation/allure-results

      - name: Download mobile allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-mobile
          path: tjw-qa-automation/allure-results

      - name: Generate Allure report
        working-directory: tjw-qa-automation
        run: npm run generate:report

      - name: Publish report into this repo's gh-pages content
        id: publish
        run: |
          set -e
          cd report-repo
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -not -name '.github' -exec rm -rf {} +
          cp -r ../tjw-qa-automation/allure-report/. .
          touch .nojekyll
          git config user.name "tjw-qa-automation-bot"
          git config user.email "noreply@tractorjunction.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No report changes to publish"
          else
            git commit -m "Publish report $(date -u '+%Y-%m-%d %H:%M:%S UTC') [nightly CI]"
            git push origin gh-pages
          fi
          echo "report_url=https://roshan-4.github.io/tjw-qa-allure-reports/" >> "$GITHUB_OUTPUT"

      - name: Send report email (roshanpaswan@tractorjunction.com only)
        env:
          EMAIL_API_URL: ${{ secrets.EMAIL_API_URL }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_SOURCE: ${{ secrets.EMAIL_SOURCE }}
          EMAIL_IDENTIFIER: ${{ secrets.EMAIL_IDENTIFIER }}
          EMAIL_PROJECT_NAME: ${{ secrets.EMAIL_PROJECT_NAME }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          DESKTOP_TOTAL: ${{ needs.desktop-tests.outputs.total }}
          DESKTOP_PASSING: ${{ needs.desktop-tests.outputs.passing }}
          DESKTOP_FAILING: ${{ needs.desktop-tests.outputs.failing }}
          MOBILE_TOTAL: ${{ needs.mobile-tests.outputs.total }}
          MOBILE_PASSING: ${{ needs.mobile-tests.outputs.passing }}
          MOBILE_FAILING: ${{ needs.mobile-tests.outputs.failing }}
          REPORT_URL: ${{ steps.publish.outputs.report_url }}
        run: |
          set -e
          TOTAL_TESTS=$(( ${DESKTOP_TOTAL:-0} + ${MOBILE_TOTAL:-0} ))
          FAILED_COUNT=$(( ${DESKTOP_FAILING:-0} + ${MOBILE_FAILING:-0} ))
          PRIORITY="Normal"
          if [ "$FAILED_COUNT" -gt 0 ]; then PRIORITY="High"; fi
          DESCRIPTION="Nightly AllLeadFormsSuit on PROD (English) — Desktop: ${DESKTOP_PASSING:-0}/${DESKTOP_TOTAL:-0} passed. Mobile: ${MOBILE_PASSING:-0}/${MOBILE_TOTAL:-0} passed."
          SUBJECT="Automation Execution Report - TractorJunction - $(date -u '+%Y-%m-%d') (Nightly CI)"
          EXECUTION_DATETIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          curl -sS --location "$EMAIL_API_URL" \
            --header "X-Api-Key: ${EMAIL_API_KEY}" \
            --header 'Accept: application/json' \
            --form "email[]=roshanpaswan@tractorjunction.com" \
            --form "source=${EMAIL_SOURCE}" \
            --form "identifier=${EMAIL_IDENTIFIER}" \
            --form "data[projectName]=${EMAIL_PROJECT_NAME}" \
            --form "data[executionDateTime]=${EXECUTION_DATETIME}" \
            --form "data[environment]=PROD" \
            --form "data[reportUrl]=${REPORT_URL}" \
            --form "data[screenshotUrl]=" \
            --form "data[failedCount]=${FAILED_COUNT}" \
            --form "data[totalTestCases]=${TOTAL_TESTS}" \
            --form "data[description]=${DESCRIPTION}" \
            --form "data[priority]=${PRIORITY}" \
            --form "data[senderName]=${EMAIL_SENDER_NAME}" \
            --form "subject=${SUBJECT}"
